services:
  - type: web
    name: rabbithole
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_PATH
        value: /var/data/rabbithole.sqlite
      - key: RABBITHOLE_USERS
        sync: false
      - key: PUBLIC_URL
        sync: false
    disk:
      name: research
      mountPath: /var/data
      sizeGB: 1
